version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: provigent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: provigent_inventory
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: provigent-backend
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/provigent_inventory
      SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/app
    command: gunicorn -w 4 -b 0.0.0.0:5000 app:create_app()

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: provigent-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  default:
    name: provigent-network
