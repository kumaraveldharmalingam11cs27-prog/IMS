<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provigent Dashboard</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f3f6fb; color: #111827; }
      .container { max-width: 1240px; margin: 0 auto; padding: 24px; }
      .card { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 16px; }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .stat { border-left: 4px solid #2563eb; }
      .stat.warn { border-color: #f59e0b; }
      .stat.crit { border-color: #dc2626; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      input, select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #d1d5db; font: inherit; }
      button { background: #2563eb; color: white; border: none; cursor: pointer; }
      button.secondary { background: #6b7280; }
      button.danger { background: #dc2626; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
      .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: 12px; color: white; }
      .good { background: #16a34a; }
      .warning { background: #f59e0b; }
      .critical { background: #dc2626; }
      .muted { color: #6b7280; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Provigent Inventory Dashboard</h1>
        <p class="muted">Interactive inventory management with add, edit, delete, and stock adjustment.</p>
      </div>
      <div id="stats" class="grid"></div>
      <div class="card">
        <h2>Inventory Form</h2>
        <div class="row">
          <input id="name" placeholder="Item name" />
          <input id="sku" placeholder="SKU" />
          <input id="quantity" type="number" placeholder="Quantity" />
          <input id="minQty" type="number" placeholder="Min" />
          <input id="maxQty" type="number" placeholder="Max" />
          <input id="unitCost" type="number" step="0.01" placeholder="Unit cost" />
          <input id="location" placeholder="Location" />
          <button onclick="saveItem()">Save Item</button>
          <button class="secondary" onclick="resetForm()">Reset</button>
        </div>
        <div class="row" style="margin-top: 10px;">
          <input id="adjustQty" type="number" placeholder="Adjustment qty" />
          <input id="adjustReason" placeholder="Reason" />
          <button onclick="adjustSelectedStock()">Adjust Stock</button>
        </div>
      </div>
      <div class="card">
        <h2>Inventory Items</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>SKU</th><th>Qty</th><th>Status</th><th>Location</th><th>Actions</th></tr>
          </thead>
          <tbody id="items"></tbody>
        </table>
      </div>
    </div>
    <script>
      const API = 'http://127.0.0.1:5000/api';
      let token = localStorage.getItem('token') || null;
      let selectedId = null;

      function getAuthHeaders() {
        return token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
      }

      async function loginIfNeeded() {
        if (token) return;
        const res = await fetch(`${API}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'admin', password: 'admin123' }) });
        const data = await res.json();
        if (res.ok) {
          token = data.access_token;
          localStorage.setItem('token', token);
        }
      }

      async function loadDashboard() {
        await loginIfNeeded();
        const [statsRes, itemsRes] = await Promise.all([
          fetch(`${API}/dashboard/stats`, { headers: getAuthHeaders() }),
          fetch(`${API}/inventory?per_page=100`, { headers: getAuthHeaders() })
        ]);
        const stats = await statsRes.json();
        const items = await itemsRes.json();
        renderStats(stats);
        renderItems(items.items || []);
      }

      function renderStats(stats) {
        document.getElementById('stats').innerHTML = `
          <div class="card stat"><h3>Total Items</h3><h2>${stats.total_items || 0}</h2></div>
          <div class="card stat warn"><h3>Low Stock</h3><h2>${stats.low_stock_count || 0}</h2></div>
          <div class="card stat crit"><h3>Pending Orders</h3><h2>${stats.pending_orders || 0}</h2></div>
          <div class="card stat"><h3>Inventory Value</h3><h2>$${Number(stats.total_inventory_value || 0).toFixed(2)}</h2></div>
        `;
      }

      function renderItems(items) {
        const rows = items.map(item => `
          <tr>
            <td>${item.name}</td>
            <td>${item.sku}</td>
            <td>${item.current_quantity}</td>
            <td><span class="pill ${item.status}">${item.status}</span></td>
            <td>${item.location || '-'}</td>
            <td>
              <button onclick="selectItem(${item.id})">Edit</button>
              <button class="secondary" onclick="adjustStock(${item.id})">Stock</button>
              <button class="danger" onclick="deleteItem(${item.id})">Delete</button>
            </td>
          </tr>
        `).join('');
        document.getElementById('items').innerHTML = rows;
      }

      async function saveItem() {
        await loginIfNeeded();
        const payload = {
          name: document.getElementById('name').value,
          sku: document.getElementById('sku').value,
          current_quantity: Number(document.getElementById('quantity').value || 0),
          min_quantity: Number(document.getElementById('minQty').value || 0),
          max_quantity: Number(document.getElementById('maxQty').value || 0),
          unit_cost: Number(document.getElementById('unitCost').value || 0),
          location: document.getElementById('location').value
        };
        const method = selectedId ? 'PUT' : 'POST';
        const url = selectedId ? `${API}/inventory/${selectedId}` : `${API}/inventory`;
        const res = await fetch(url, { method, headers: getAuthHeaders(), body: JSON.stringify(payload) });
        const data = await res.json();
        if (res.ok) { resetForm(); loadDashboard(); } else { alert(data.error || 'Failed'); }
      }

      async function deleteItem(itemId) {
        await loginIfNeeded();
        const res = await fetch(`${API}/inventory/${itemId}`, { method: 'DELETE', headers: getAuthHeaders() });
        const data = await res.json();
        if (res.ok) { loadDashboard(); } else { alert(data.error || 'Delete failed'); }
      }

      async function selectItem(itemId) {
        await loginIfNeeded();
        const res = await fetch(`${API}/inventory/${itemId}`, { headers: getAuthHeaders() });
        const item = await res.json();
        selectedId = item.id;
        document.getElementById('name').value = item.name || '';
        document.getElementById('sku').value = item.sku || '';
        document.getElementById('quantity').value = item.current_quantity || 0;
        document.getElementById('minQty').value = item.min_quantity || 0;
        document.getElementById('maxQty').value = item.max_quantity || 0;
        document.getElementById('unitCost').value = item.unit_cost || 0;
        document.getElementById('location').value = item.location || '';
      }

      async function adjustSelectedStock() {
        if (!selectedId) { alert('Select an item first'); return; }
        await loginIfNeeded();
        const payload = { item_id: selectedId, quantity: Number(document.getElementById('adjustQty').value || 0), reason: document.getElementById('adjustReason').value || 'manual adjustment', notes: 'Adjusted from dashboard' };
        const res = await fetch(`${API}/stock/adjust`, { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(payload) });
        const data = await res.json();
        if (res.ok) { document.getElementById('adjustQty').value = ''; document.getElementById('adjustReason').value=''; loadDashboard(); } else { alert(data.error || 'Adjustment failed'); }
      }

      function adjustStock(itemId) { selectedId = itemId; document.getElementById('adjustQty').focus(); }
      function resetForm() { selectedId = null; document.getElementById('name').value=''; document.getElementById('sku').value=''; document.getElementById('quantity').value=''; document.getElementById('minQty').value=''; document.getElementById('maxQty').value=''; document.getElementById('unitCost').value=''; document.getElementById('location').value=''; document.getElementById('adjustQty').value=''; document.getElementById('adjustReason').value=''; }
      loadDashboard();
    </script>
  </body>
</html>
